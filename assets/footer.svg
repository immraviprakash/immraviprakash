<svg width="900" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#161310"/>
    </linearGradient>
    <linearGradient id="footerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a45a;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#c8a45a;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#c8a45a;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="120" fill="url(#footerBg)"/>
  
  <!-- Top gold line -->
  <rect x="0" y="0" width="900" height="1" fill="url(#footerGold)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Quote -->
  <text x="450" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="#c0b8a0" text-anchor="middle" opacity="0.85">"Crafting purposeful software where intelligent AI and clean engineering intersect."</text>
  
  <!-- Name -->
  <text x="450" y="76" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#777" text-anchor="middle" letter-spacing="4">RAVI PRAKASH K · BENGALURU</text>
  
  <!-- Decorative dots -->
  <circle cx="398" cy="94" r="1.5" fill="#c8a45a" opacity="0.3"/>
  <circle cx="415" cy="94" r="1.5" fill="#c8a45a" opacity="0.5"/>
  <circle cx="432" cy="94" r="1.5" fill="#c8a45a" opacity="0.7"/>
  <circle cx="449" cy="94" r="2" fill="#c8a45a" opacity="0.95">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="466" cy="94" r="1.5" fill="#c8a45a" opacity="0.7"/>
  <circle cx="483" cy="94" r="1.5" fill="#c8a45a" opacity="0.5"/>
  <circle cx="500" cy="94" r="1.5" fill="#c8a45a" opacity="0.3"/>
</svg>
