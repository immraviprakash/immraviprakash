<svg width="900" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark rich gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="50%" style="stop-color:#161310"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    
    <!-- Gold accent gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a45a"/>
      <stop offset="50%" style="stop-color:#e8c96a"/>
      <stop offset="100%" style="stop-color:#c8a45a"/>
    </linearGradient>
    
    <!-- Warm glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft ambient glow -->
    <radialGradient id="ambientGlow" cx="72%" cy="32%" r="48%">
      <stop offset="0%" style="stop-color:#c8a45a;stop-opacity:0.09"/>
      <stop offset="100%" style="stop-color:#c8a45a;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.035"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)"/>
  <rect width="900" height="280" fill="url(#grid)"/>
  <rect width="900" height="280" fill="url(#ambientGlow)"/>
  
  <!-- Decorative top line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#gold)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Left decorative accent bar -->
  <rect x="60" y="55" width="3" height="55" rx="1.5" fill="url(#gold)" opacity="0.5">
    <animate attributeName="height" values="50;60;50" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Pre-text -->
  <text x="80" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#c8a45a" letter-spacing="3" opacity="0.9">PORTFOLIO &amp; LAB // RAVI PRAKASH K</text>

  <!-- Name -->
  <text x="80" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#f0ebe0" letter-spacing="-1">Ravi Prakash K</text>
  
  <!-- Role text -->
  <text x="80" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16.5" fill="#a09880" letter-spacing="0.8">Full-Stack Developer · Android · AI-Powered Products</text>

  <!-- Blinking cursor -->
  <rect x="525" y="153" width="2" height="18" fill="#c8a45a">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Decorative corner brackets - top right -->
  <path d="M 800 40 L 830 40 L 830 70" fill="none" stroke="#c8a45a" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Decorative corner brackets - bottom right -->
  <path d="M 800 240 L 830 240 L 830 210" fill="none" stroke="#c8a45a" stroke-width="1.5" opacity="0.3"/>

  <!-- Right side floating code symbols -->
  <g opacity="0.14" fill="#c8a45a">
    <text x="715" y="80" font-family="'Courier New', monospace" font-size="14">&lt;/&gt;</text>
    <text x="750" y="110" font-family="'Courier New', monospace" font-size="12">fn()</text>
    <text x="705" y="140" font-family="'Courier New', monospace" font-size="13">λ</text>
    <text x="765" y="165" font-family="'Courier New', monospace" font-size="11">0x1A</text>
  </g>

  <!-- Animated floating dots -->
  <circle cx="680" cy="90" r="2" fill="#c8a45a" opacity="0.2">
    <animate attributeName="cy" values="90;80;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="150" r="1.5" fill="#c8a45a" opacity="0.15">
    <animate attributeName="cy" values="150;140;150" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="200" r="2.5" fill="#c8a45a" opacity="0.1">
    <animate attributeName="cy" values="200;188;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.2;0.05" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Location badge -->
  <g transform="translate(80, 195)">
    <rect width="160" height="28" rx="14" fill="#141414" stroke="#2a2620" stroke-width="0.8"/>
    <!-- Map pin icon -->
    <circle cx="16" cy="12" r="3" fill="none" stroke="#c8a45a" stroke-width="1.2"/>
    <circle cx="16" cy="11" r="1" fill="#c8a45a"/>
    <path d="M16 15 L16 19" stroke="#c8a45a" stroke-width="1" opacity="0.6"/>
    <text x="32" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#a09880" font-weight="500">Bengaluru, India</text>
  </g>

  <!-- Open to collaborate / work badge -->
  <g transform="translate(255, 195)">
    <rect width="145" height="28" rx="14" fill="#141414" stroke="#203020" stroke-width="0.8"/>
    <circle cx="16" cy="14" r="4.5" fill="#1b381b"/>
    <circle cx="16" cy="14" r="2.5" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#a09880" font-weight="500">Open to Projects</text>
  </g>

  <!-- Bottom decorative line -->
  <line x1="60" y1="250" x2="840" y2="250" stroke="#222" stroke-width="0.5"/>
  
  <!-- Bottom gold accent -->
  <rect x="0" y="278" width="900" height="2" fill="url(#gold)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
